name: Build


on: [push, pull_request]

jobs:
  tox:
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          - 'windows-latest'
          - 'macos-latest'
        python-version:
          # Matches setup.py python_requires.
          - '3.10'
          - '3.11'
          - '3.12'
        node-version:
          - '18.x'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        # Need full history to determine version number.
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/cache@v4
      with:
        path: "**/node_modules"
        key: ${{ runner.os }}-${{ matrix.node-version }}-node_modules-${{ hashFiles('**/package-lock.json') }}
    - run: npm install
      working-directory: frontend
    - run: npm run tsc
      working-directory: frontend
    - run: npm test
      working-directory: frontend
    - name: Install pdftotext (on Linux)
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install poppler-utils
    - name: Install Python packaging/test tools
      # setuptools is no longer bundled with Python >=3.12, and installing
      # setuptools_scm explicitly avoids setup.py's legacy setup_requires egg
      # fetch (which breaks on modern setuptools).  Upgrade so the setuptools
      # bundled with older Pythons (58.x on macOS/Windows 3.9) isn't kept
      # alongside a setuptools_scm that requires a newer one.
      run: python -m pip install --upgrade tox wheel setuptools setuptools_scm
    - name: Show package version
      run: python setup.py --version
    - name: Test with tox
      run: tox -vv
    - name: Build wheel
      run: python setup.py bdist_wheel
    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      if: ${{ runner.os == 'Linux' && matrix.python-version == '3.10' }}
      with:
        name: python-packages
        path: |
          dist/*.whl
          dist/*.tar.gz
